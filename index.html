<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f9dccb">
  <meta name="description" content="A cat lives here. Pets accepted, treats preferred.">
  <title>A Cat Lives Here</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Gaegu:wght@700&display=swap">
  <link rel="stylesheet" href="/assets/css/style.css">
  <script type="module" src="/assets/js/room.js"></script>
</head>
<body>
  <div id="stage"></div>

  <header class="top">
    <a class="mark" href="/" aria-label="alvin, home"></a>
    <p class="clock">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5a8.5 8.5 0 1 0 0 17 8.5 8.5 0 0 0 0-17Z" fill="#fff" stroke="currentColor" stroke-width="2.2"/><path d="M12 7.5V12l3 2" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      <span id="clock-time">--:--</span>
      <span class="clock-phase" id="clock-phase"></span>
    </p>
  </header>

  <main class="intro">
    <h1>a <span class="hl">cat</span> lives here.</h1>
    <p>This one is called <strong id="cat-name">…</strong>. Pets accepted, treats preferred, and the yarn is not up for discussion.</p>  </main>
  <div class="bubble" id="bubble" role="status" aria-live="polite"></div>

  <nav class="dock" aria-label="Cat controls">
    <button id="treat-btn" type="button">
      <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M5 16c4-7 15-8 20 0-5 8-16 7-20 0Z" fill="#f7a35c" stroke="#4b3434" stroke-width="2.2" stroke-linejoin="round"/><path d="M6 16 1 11v10Z" fill="#f7a35c" stroke="#4b3434" stroke-width="2.2" stroke-linejoin="round"/><circle cx="20" cy="15" r="1.6" fill="#4b3434"/></svg>
      treat<span class="label-long">&nbsp;time</span>
    </button>
    <span class="sep" aria-hidden="true"></span>
    <button id="another-btn" type="button">
      <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M6 27c-1-9 1-15 2-21l6 5h4l6-5c1 6 3 12 2 21Z" fill="#f7b267" stroke="#4b3434" stroke-width="2.2" stroke-linejoin="round"/><circle cx="12.5" cy="18" r="1.7" fill="#4b3434"/><circle cx="19.5" cy="18" r="1.7" fill="#4b3434"/><path d="M14.5 22q1.5 1.5 3 0" fill="none" stroke="#4b3434" stroke-width="1.8" stroke-linecap="round"/></svg>
      another<span class="label-long">&nbsp;cat</span>
    </button>
    <span class="pets" title="Pets given in this browser">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-8-5-8-11a4.5 4.5 0 0 1 8-2.6A4.5 4.5 0 0 1 20 9c0 6-8 11-8 11Z" fill="#f2637e" stroke="#4b3434" stroke-width="2" stroke-linejoin="round"/></svg>
      <span id="pets">0</span><span class="sr"> pets given</span>
    </span>
  </nav>
</body>
</html>
